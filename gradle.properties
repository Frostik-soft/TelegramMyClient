## Project-wide Gradle settings.
##
For more details on how to configure your build environment, see the [JVM arguments](https://docs.gradle.org/current/userguide/jvm_general.html#jvm-arguments) used for the daemon process.

The setting is particularly useful for tweaking memory usage.

Default value: `-Xmx1024m -XX:MaxPermSize=256m`

org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

When configured, Gradle will run in incubating parallel mode. This option should only be used with decoupled projects.

http://www.gradle.org/docs/current/userguide/multi-processor.html

org.gradle.parallel=true
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx4096M
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
