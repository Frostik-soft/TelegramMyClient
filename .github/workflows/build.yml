name:  Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Update Gradle wrapper
        run: |
          chmod +x gradlew
          sed -i 's/gradle-7.0.2-bin.zip/gradle-7.6.4-bin.zip/' gradle/wrapper/gradle-wrapper.properties

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMyClient-Debug
          path: TMessagesProj/build/outputs/apk/debug/*.apk
